<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Test</title>
<style>
body { background:#004b76; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:Arial,sans-serif; }
.btn { background:#f0801e; color:#fff; border:none; border-radius:50px; padding:18px 36px; font-size:16px; font-weight:800; letter-spacing:1px; text-transform:uppercase; cursor:pointer; text-decoration:none; display:block; text-align:center; margin:10px; }
.wrap { text-align:center; padding:20px; }
h2 { color:#fff; font-size:14px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; opacity:0.6; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Test shortcuts</h2>
  <a class="btn" href="portrait.html" onclick="setTestData()">Test Portrait Screen</a>
  <a class="btn" href="quiz.html" onclick="setTestData()">Test Quiz Directly</a>
</div>
<script>
function setTestData(){
  try {
    sessionStorage.setItem('vc_driver_num','999');
    sessionStorage.setItem('vc_driver_name','Test Driver');
    sessionStorage.setItem('vc_car_reg','TEST 001');
  } catch(e){}
}
</script>
